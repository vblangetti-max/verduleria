<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1B5E20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Verdulería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: #2E7D32;
      --verde-osc: #1B5E20;
      --verde-clr: #E8F5E9;
      --rojo: #C62828;
      --rojo-clr: #FFEBEE;
      --bg: #F4F6F3;
      --card: #FFFFFF;
      --text: #1A1A1A;
      --text-2: #6B7280;
      --border: #E5E7EB;
      --radius: 16px;
      --radius-sm: 10px;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: var(--verde-osc);
      padding: 52px 20px 20px;
      color: white;
    }
    .header-title { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
    .header-sub { font-size: 13px; opacity: 0.7; margin-top: 2px; }

    /* NAV */
    .nav {
      display: flex;
      background: var(--verde-osc);
      padding: 0 12px 0;
      gap: 4px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px 8px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .nav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn.active { color: white; border-bottom-color: white; }

    /* CONTENT */
    .content { flex: 1; padding: 20px 16px 100px; }

    /* SCREENS */
    .screen { display: none; }
    .screen.visible { display: block; }

    /* AMOUNT CARD */
    .amount-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .amount-label { font-size: 12px; font-weight: 500; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
    .amount-row { display: flex; align-items: center; gap: 6px; }
    .currency { font-size: 28px; font-weight: 500; color: var(--text-2); }
    .amount-input {
      flex: 1;
      font-size: 42px;
      font-weight: 600;
      border: none;
      background: none;
      outline: none;
      color: var(--text);
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: -1px;
    }
    .amount-input::placeholder { color: #D1D5DB; }
    .amount-input.verde { color: var(--verde); }
    .amount-input.rojo { color: var(--rojo); }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* FIELDS */
    .field-group { margin-bottom: 14px; }
    .field-label { font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field-select, .field-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }
    .field-select:focus, .field-input:focus { border-color: var(--verde); }

    /* BUTTONS */
    .btn-register {
      width: 100%;
      padding: 18px;
      border-radius: var(--radius);
      border: none;
      font-size: 17px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
      color: white;
      letter-spacing: -0.2px;
    }
    .btn-v { background: var(--verde); }
    .btn-v:active { background: var(--verde-osc); transform: scale(0.98); }
    .btn-g { background: var(--rojo); }
    .btn-g:active { background: #7F0000; transform: scale(0.98); }
    .btn-register:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    /* RESUMEN */
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border-radius: var(--radius-sm); padding: 16px; border: 1px solid var(--border); }
    .stat-card.full { grid-column: 1 / -1; }
    .stat-label { font-size: 11px; font-weight: 500; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
    .stat-value.verde { color: var(--verde); }
    .stat-value.rojo { color: var(--rojo); }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 24px 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-refresh {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-refresh svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

    .historial-card { background: var(--card); border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; }
    .historial-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .historial-item:last-child { border-bottom: none; }
    .hist-left { flex: 1; }
    .hist-fecha { font-size: 13px; color: var(--text-2); }
    .hist-cat { font-size: 12px; color: var(--text-2); opacity: 0.7; margin-top: 1px; }
    .hist-amount { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
    .hist-amount.verde { color: var(--verde); }
    .hist-amount.rojo { color: var(--rojo); }

    .empty-msg { text-align: center; padding: 24px; color: var(--text-2); font-size: 14px; background: var(--card); border-radius: var(--radius-sm); border: 1px solid var(--border); }

    /* LOADING */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
    .spinner-dark { border-color: var(--border); border-top-color: var(--text-2); }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1A1A1A;
      color: white;
      padding: 13px 22px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      z-index: 999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--rojo); }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-title">🥬 Verdulería</div>
    <div class="header-sub">Registro de ventas y gastos</div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" id="nav-ventas" onclick="showScreen('ventas')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/><path d="M12 6v6l4 2"/></svg>
      Ventas
    </button>
    <button class="nav-btn" id="nav-gastos" onclick="showScreen('gastos')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>
      Gastos
    </button>
    <button class="nav-btn" id="nav-resumen" onclick="showScreen('resumen')">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/></svg>
      Resumen
    </button>
  </nav>

  <div class="content">

    <!-- VENTAS -->
    <div class="screen visible" id="screen-ventas">
      <div class="amount-card">
        <div class="amount-label">Importe de venta</div>
        <div class="amount-row">
          <span class="currency">$</span>
          <input class="amount-input verde" type="number" inputmode="decimal" placeholder="0.00" id="input-venta" min="0" step="0.01" />
        </div>
      </div>
      <button class="btn-register btn-v" id="btn-venta" onclick="registrarVenta()">
        Registrar venta
      </button>
    </div>

    <!-- GASTOS -->
    <div class="screen" id="screen-gastos">
      <div class="amount-card">
        <div class="amount-label">Importe del gasto</div>
        <div class="amount-row">
          <span class="currency">$</span>
          <input class="amount-input rojo" type="number" inputmode="decimal" placeholder="0.00" id="input-gasto" min="0" step="0.01" />
        </div>
        <div class="divider"></div>
        <div class="field-group">
          <div class="field-label">Categoría</div>
          <select class="field-select" id="select-categoria">
            <option>Mercadería / Frutas y Verduras</option>
            <option>Bolsas y Packaging</option>
            <option>Alquiler</option>
            <option>Servicios (Luz, Gas, Agua)</option>
            <option>Sueldos / Personal</option>
            <option>Transporte / Flete</option>
            <option>Mantenimiento</option>
            <option>Impuestos / Tasas</option>
            <option>Otros</option>
          </select>
        </div>
        <div class="field-group" style="margin-bottom:0">
          <div class="field-label">Descripción (opcional)</div>
          <input class="field-input" type="text" placeholder="Ej: Compra en el mercado central" id="input-desc" />
        </div>
      </div>
      <button class="btn-register btn-g" id="btn-gasto" onclick="registrarGasto()">
        Registrar gasto
      </button>
    </div>

    <!-- RESUMEN -->
    <div class="screen" id="screen-resumen">
      <div class="section-title">
        Hoy
        <button class="btn-refresh" onclick="cargarResumen()">
          <svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
          Actualizar
        </button>
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Ventas</div><div class="stat-value verde" id="stat-v-hoy">—</div></div>
        <div class="stat-card"><div class="stat-label">Gastos</div><div class="stat-value rojo" id="stat-g-hoy">—</div></div>
        <div class="stat-card full"><div class="stat-label">Ganancia del día</div><div class="stat-value" id="stat-gan-hoy">—</div></div>
      </div>

      <div class="section-title">Este mes</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Ventas</div><div class="stat-value verde" id="stat-v-mes">—</div></div>
        <div class="stat-card"><div class="stat-label">Gastos</div><div class="stat-value rojo" id="stat-g-mes">—</div></div>
        <div class="stat-card full"><div class="stat-label">Ganancia del mes</div><div class="stat-value" id="stat-gan-mes">—</div></div>
      </div>

      <div class="section-title">Últimas ventas</div>
      <div id="lista-ventas"><div class="empty-msg">Cargando...</div></div>

      <div class="section-title">Últimos gastos</div>
      <div id="lista-gastos"><div class="empty-msg">Cargando...</div></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKZ0E8hgEH1TX8O246Bxj9laX-ab72RFy9HIL5wiZzIAIwhUbdbZj-I3UEoGenRcMlAA/exec";

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('visible'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('visible');
    document.getElementById('nav-' + name).classList.add('active');
    if (name === 'resumen') cargarResumen();
  }

  function toast(msg, error) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (error ? ' error' : '') + ' show';
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  function fmt(n) {
    return '$ ' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function ahora() {
    const d = new Date();
    const fecha = d.toLocaleDateString('es-AR');
    const hora = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    const mes = d.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
    return { fecha, hora, mes };
  }

  async function registrarVenta() {
    const val = parseFloat(document.getElementById('input-venta').value);
    if (!val || val <= 0) { toast('Ingresá un importe válido', true); return; }
    const btn = document.getElementById('btn-venta');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    const { fecha, hora, mes } = ahora();
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ hoja: 'VENTAS', fila: [fecha, hora, val, mes] })
      });
      document.getElementById('input-venta').value = '';
      toast('✓ Venta de ' + fmt(val) + ' guardada');
    } catch (e) {
      toast('Error al guardar. Chequeá internet.', true);
    }
    btn.disabled = false;
    btn.textContent = 'Registrar venta';
  }

  async function registrarGasto() {
    const val = parseFloat(document.getElementById('input-gasto').value);
    if (!val || val <= 0) { toast('Ingresá un importe válido', true); return; }
    const cat = document.getElementById('select-categoria').value;
    const desc = document.getElementById('input-desc').value;
    const btn = document.getElementById('btn-gasto');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    const { fecha, hora, mes } = ahora();
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ hoja: 'GASTOS', fila: [fecha, hora, val, cat, desc, mes] })
      });
      document.getElementById('input-gasto').value = '';
      document.getElementById('input-desc').value = '';
      toast('✓ Gasto de ' + fmt(val) + ' guardado');
    } catch (e) {
      toast('Error al guardar. Chequeá internet.', true);
    }
    btn.disabled = false;
    btn.textContent = 'Registrar gasto';
  }

  async function cargarResumen() {
    try {
      const hoy = new Date().toLocaleDateString('es-AR');
      const mesAct = new Date().getMonth();
      const anioAct = new Date().getFullYear();

      const [rv, rg] = await Promise.all([
        fetch(SCRIPT_URL + '?hoja=VENTAS').then(r => r.json()),
        fetch(SCRIPT_URL + '?hoja=GASTOS').then(r => r.json())
      ]);

      const ventas = rv.ok ? rv.datos.slice(1).filter(r => parseFloat(r[2]) > 0) : [];
      const gastos = rg.ok ? rg.datos.slice(1).filter(r => parseFloat(r[2]) > 0) : [];

      function parseFecha(str) {
        const p = str.split('/');
        return { d: parseInt(p[0]), m: parseInt(p[1]) - 1, a: parseInt(p[2]) };
      }

      const ventasHoy = ventas.filter(r => r[0] === hoy);
      const gastosHoy = gastos.filter(r => r[0] === hoy);
      const ventasMes = ventas.filter(r => { const f = parseFecha(r[0]); return f.m === mesAct && f.a === anioAct; });
      const gastosMes = gastos.filter(r => { const f = parseFecha(r[0]); return f.m === mesAct && f.a === anioAct; });

      const sum = arr => arr.reduce((a, r) => a + parseFloat(r[2] || 0), 0);
      const vH = sum(ventasHoy), gH = sum(gastosHoy);
      const vM = sum(ventasMes), gM = sum(gastosMes);

      document.getElementById('stat-v-hoy').textContent = fmt(vH);
      document.getElementById('stat-g-hoy').textContent = fmt(gH);
      const ganH = vH - gH;
      const elGH = document.getElementById('stat-gan-hoy');
      elGH.textContent = fmt(ganH);
      elGH.className = 'stat-value ' + (ganH >= 0 ? 'verde' : 'rojo');

      document.getElementById('stat-v-mes').textContent = fmt(vM);
      document.getElementById('stat-g-mes').textContent = fmt(gM);
      const ganM = vM - gM;
      const elGM = document.getElementById('stat-gan-mes');
      elGM.textContent = fmt(ganM);
      elGM.className = 'stat-value ' + (ganM >= 0 ? 'verde' : 'rojo');

      const ultV = ventas.slice(-5).reverse();
      document.getElementById('lista-ventas').innerHTML = ultV.length
        ? '<div class="historial-card">' + ultV.map(r =>
            `<div class="historial-item">
              <div class="hist-left"><div class="hist-fecha">${r[0]} · ${r[1]}</div></div>
              <div class="hist-amount verde">${fmt(parseFloat(r[2]))}</div>
            </div>`).join('') + '</div>'
        : '<div class="empty-msg">Sin ventas registradas aún</div>';

      const ultG = gastos.slice(-5).reverse();
      document.getElementById('lista-gastos').innerHTML = ultG.length
        ? '<div class="historial-card">' + ultG.map(r =>
            `<div class="historial-item">
              <div class="hist-left">
                <div class="hist-fecha">${r[0]} · ${r[1]}</div>
                <div class="hist-cat">${r[3] || ''}</div>
              </div>
              <div class="hist-amount rojo">${fmt(parseFloat(r[2]))}</div>
            </div>`).join('') + '</div>'
        : '<div class="empty-msg">Sin gastos registrados aún</div>';

    } catch (e) {
      toast('No se pudo cargar el resumen', true);
    }
  }
</script>
</body>
</html>
